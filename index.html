<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlay Club">
<meta name="theme-color" content="#0a0d12">
<link rel="apple-touch-icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<link rel="icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<title>Parlay Club</title>
<link rel="stylesheet" href="styles.css">
<style>
/* The All tab: both records on one row, tap a row for that person's weeks. */
.seg { grid-template-columns: 1fr 1fr 1fr; }

.prow.all { display: block; cursor: pointer; }
.prow.all .ptop { display: flex; align-items: center; gap: 11px; }

.pchev {
  color: var(--dim); font-size: 11px; flex: none;
  transition: transform 0.18s;
}
.prow.all.open .pchev { transform: rotate(90deg); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.sp {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; min-width: 0;
}
.spl {
  font-size: 10px; font-weight: 750; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
}
.spr { font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spr.good { color: var(--accent); }
.spr.bad { color: var(--loss); }
.spr.even { color: var(--text); }
.spr.none { color: var(--dim); }

.pdet { display: none; margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px; }

/* Two stats worth arguing about, above the week-by-week. */
.pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 11px; }
.pstat {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; min-width: 0;
}
.psl {
  font-size: 10px; font-weight: 750; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
}
.psv { font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; }
.psv.bad { color: var(--loss-soft); }
.prow.all.open .pdet { display: block; }
.drow { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
.dwk { font-size: 11px; color: var(--dim); width: 82px; flex: none; white-space: nowrap; }
.dpk {
  font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dpk.blank { color: var(--dim); font-style: italic; }

/* Full-width bars above the tiles: parlay wins, then the money. */
.parlay {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 13px 16px; margin: 14px 0 9px;
}
.tiles { margin-top: 0; }
.parlay .plab {
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim);
}
.parlay .psubl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.parlay .pval {
  font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; flex: none;
}
.parlay.hit {
  border-color: #2f5c42;
  background: linear-gradient(180deg, #16241c 0%, var(--panel) 75%);
}
.parlay.hit .plab, .parlay.hit .pval { color: var(--accent); }

.icon-btn.sym {
  width: 52px; min-width: 52px; padding: 0;
  font-size: 20px; line-height: 1;
}
.icon-btn.sym.busy { color: var(--dim); }
.icon-btn.sym.done { color: var(--accent); border-color: #2f5c42; }

.admin-link {
  display: block; text-align: center; margin-top: 9px;
  font-size: 12px; font-weight: 650; color: var(--dim);
  text-decoration: none; padding: 6px;
}
.admin-link:active { color: var(--muted); }

/* A slate still running leads the page: the tag, the running count, and the
   five legs themselves, so opening the app tells you what is riding. */
.ip {
  border: 1px solid #6b5312;
  background: linear-gradient(180deg, #241d08 0%, var(--panel-2) 70%);
  border-radius: 15px;
  padding: 13px 14px;
  margin-bottom: 12px;
}
.ip-top { display: flex; align-items: center; gap: 9px; }
.ip-tag {
  font-size: 10px; font-weight: 850; letter-spacing: 0.9px;
  color: #241a02; background: var(--gold);
  border-radius: 5px; padding: 3px 7px; flex: none;
}
.ip-lab { font-size: 14px; font-weight: 700; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ip-rec { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
/* The parlay price, when it was logged. No odds, no chip. */
.ip-odds {
  font-size: 11px; font-weight: 800; flex: none;
  color: var(--gold-soft); background: var(--gold-bg);
  border-radius: 5px; padding: 2px 6px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.ip-legs { margin-top: 11px; display: grid; gap: 6px; }
.ip-leg { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ip-nm { width: 56px; flex: none; font-size: 12.5px; font-weight: 650; }
.ip-pk { font-size: 12.5px; color: var(--muted); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ip-pk.blank { color: #414b5c; }
.ip-share { width: 100%; margin-top: 12px; }

.wk-share { width: 100%; margin-top: 11px; }

.parlay.mini { padding: 9px 14px; margin-bottom: 12px; }
.parlay.mini .plab { font-size: 10px; letter-spacing: 0.8px; }
.parlay.mini .psubl { font-size: 10.5px; margin-top: 2px; }
.parlay.mini .pval { font-size: 23px; letter-spacing: -0.8px; }

.parlay.up { border-color: #2f5c42; }
.parlay.up .pval { color: var(--accent); }
.parlay.down { border-color: #5c3129; }
.parlay.down .pval { color: var(--loss); }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="bar">
      <div>
        <h1 class="title">Parlay Club</h1>
        <div class="sub-season" id="season"></div>
      </div>
      <div class="bar-actions">
        <button class="icon-btn sym" id="refresh" aria-label="Refresh" title="Refresh">&#8635;</button>
      </div>
    </div>
    <div class="seg" id="seg">
      <button data-lg="all" class="on">All</button>
      <button data-lg="cfb">College</button>
      <button data-lg="nfl">NFL</button>
    </div>
  </div>

  <div class="msg err" id="err"></div>
  <div class="msg info" id="info"></div>

  <div id="inplay"></div>

  <div class="sec-head">
    <h2 id="seasonTitle">Season</h2>
    <span class="note" id="seasonNote"></span>
  </div>

  <div class="parlay" id="parlay"></div>

  <div class="parlay" id="money"></div>

  <div class="tiles" id="tiles"></div>

  <div class="rule"></div>

  <div class="sec-head">
    <h2 id="secTitle">Individual records</h2>
    <span class="note" id="secNote"></span>
  </div>
  <div class="rows" id="rows"></div>

  <div class="rule"></div>

  <div class="sec-head">
    <h2 id="histTitle">History</h2>
    <span class="note" id="histNote"></span>
  </div>
  <div id="hist"></div>

  <p class="foot-note" id="foot"></p>
  <a class="admin-link" href="admin.html">Admin</a>
  <a class="admin-link" href="history.html" style="margin-top:0">History</a>
</div>

<script src="app.js"></script>
<script>
let DATA = null;
let STATS = null;
let LG = "all";
let OPEN = null;        // name of the expanded row in the All view

const $ = id => document.getElementById(id);

let LAST_SIG = "";

function stamp() {
  return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

/* quiet = no button state change, for the automatic refresh on reopen. */
async function boot(quiet) {
  const btn = $("refresh");
  if (!quiet) { btn.disabled = true; btn.classList.add("busy"); }
  $("err").classList.remove("show");
  try {
    DATA = await loadResults();
  } catch (e) {
    $("err").textContent = "Could not load results.json. " + e.message;
    $("err").classList.add("show");
    return;
  } finally {
    btn.disabled = false;
    btn.classList.remove("busy");
  }

  // Two refreshes in the same minute leave the timestamp identical, so the
  // button itself confirms the tap landed.
  if (!quiet) {
    btn.textContent = "\u2713";
    btn.classList.add("done");
    clearTimeout(boot.reset);
    boot.reset = setTimeout(() => {
      btn.textContent = "\u21BB";
      btn.classList.remove("done");
    }, 1400);
  }

  // Nothing on screen moves when the results are unchanged, so say so.
  const sig = JSON.stringify(DATA.entries);
  const changed = LAST_SIG && sig !== LAST_SIG;
  LAST_SIG = sig;

  STATS = computeStats(DATA);
  $("season").textContent = DATA.season ? DATA.season + " Season" : "";
  render();
  $("foot").textContent = "Updated " + stamp() + (changed ? " · new results" : "");
}

// Coming back to the app from the Home Screen should show current numbers.
document.addEventListener("visibilitychange", () => { if (!document.hidden) boot(true); });

/* Everyone tied at the top gets the star, so the rows agree with the Leader
   tile instead of crowning whoever happens to sort first. */
function isLeader(key, name, played) {
  const ld = STATS.leaders[key];
  return played > 0 && !!ld && ld.names.indexOf(name) !== -1;
}

const LG_NAME = { all: "Overall", cfb: "College Football", nfl: "NFL" };
const TILE_LAB = { all: "Group overall", cfb: "Group college", nfl: "Group NFL" };
const PARLAY_LAB = { all: "Season parlay wins", cfb: "Season college parlay wins",
                     nfl: "Season NFL parlay wins" };
const MONEY_LAB = { all: "Money on the year", cfb: "College money", nfl: "NFL money" };

/* Anything still running goes at the very top, legs and all. */
function renderInPlay() {
  const live = inPlayEntries(DATA);
  const el = $("inplay");
  if (!live.length) { el.innerHTML = ""; return; }

  el.innerHTML = live.map(e => {
    const t = tally(DATA, e);
    const legs = DATA.players.map(p => {
      const v = e.picks[p] || {};
      const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "P" ? "p" : "none";
      const mark = v.result === "P" ? "P" : (v.result || "-");
      return `<div class="ip-leg"><span class="dot ${cls}">${mark}</span>` +
             `<span class="ip-nm">${esc(p)}</span>` +
             `<span class="ip-pk${v.pick ? "" : " blank"}">${esc(v.pick || "no pick logged")}</span></div>`;
    }).join("");
    const odds = fmtOdds(e.odds);
    return `<div class="ip">
      <div class="ip-top">
        <span class="ip-tag">IN PLAY</span>
        <span class="ip-lab">${esc(e.label)}</span>
        ${odds ? `<span class="ip-odds">${esc(odds)}</span>` : ""}
        <span class="ip-rec">${t.w}-${t.l}</span>
      </div>
      <div class="ip-legs">${legs}</div>
      <button class="btn sm ip-share" data-slate="${esc(e.id)}">Share these picks</button>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-slate]").forEach(b =>
    b.addEventListener("click", () => shareSlate(b.dataset.slate)));
}

/* One image of a slate's five legs, for sending round. */
async function shareSlate(id) {
  const e = DATA.entries.find(x => x.id === id);
  if (!e) return;
  const url = location.href.replace(/[^/]*$/, "").replace(/\/$/, "") + "/";
  const cv = buildSlateCard(DATA, e, url);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  const file = new File([blob], "parlay-club-slate-" + e.id + ".png", { type: "image/png" });
  const text = url;                        // the image says the rest
  const note = t => { $("info").textContent = t; $("info").classList.add("show"); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
    } else if (navigator.share) {
      await navigator.share({ text, url });
      note("Shared the link. This browser will not attach images.");
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      note("Saved the image. This browser has no share sheet.");
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
    note("Share failed: " + err.message);
  }
}

function render() {
  renderInPlay();
  const key = LG;
  const rec = STATS.group[key];
  const gp = STATS.groupPct[key];
  const ld = STATS.leaders[key];
  const rows = STATS.byLeague[key];
  const n = STATS.counts[key];

  const won = STATS.parlays[key];
  const done = STATS.settled[key];
  $("parlay").className = "parlay" + (won ? " hit" : "");
  $("parlay").innerHTML =
    `<div>
       <div class="plab">${PARLAY_LAB[key]}</div>
       <div class="psubl">${done
         ? "out of " + done + " completed slate" + (done === 1 ? "" : "s")
         : "no slate has finished yet"}</div>
     </div>
     <div class="pval">${won}</div>`;

  const m = STATS.money[key];
  $("money").className = "parlay mini" + (m.net > 0 ? " up" : m.net < 0 ? " down" : "");
  $("money").innerHTML =
    `<div>
       <div class="plab">${MONEY_LAB[key]}</div>
       <div class="psubl">${fmtMoney(m.wagered)} in at ${fmtMoney(m.stake)} a slate &middot; ${
         fmtMoney(m.won)} back${m.unpriced ? " &middot; " + m.unpriced + " payout" +
         (m.unpriced === 1 ? "" : "s") + " not entered" : ""}</div>
     </div>
     <div class="pval">${fmtMoney(m.net)}</div>`;

  $("tiles").innerHTML =
    `<div class="tile">
       <div class="lab">${TILE_LAB[key]}</div>
       <div class="val">${fmtRec(rec)}</div>
       <div class="foot">${fmtPct(gp, rec)} &middot; ${n} ${
         key === "all" ? (n === 1 ? "entry" : "entries") : (n === 1 ? "week" : "weeks")}</div>
     </div>
     <div class="tile">
       <div class="lab">Leader</div>
       <div class="val name">${esc(leaderLabel(ld))}</div>
       <div class="foot">${esc(leaderFoot(ld))}</div>
     </div>`;

  // the tabs already say which league, so the heads stay put
  $("seasonNote").textContent = n
    ? n + (key === "all" ? (n === 1 ? " slate" : " slates")
                         : (n === 1 ? " week" : " weeks")) : "";
  const hot = rows.filter(r => r.streak[key] >= 2).length;
  const pend = STATS.pending[key];
  $("secNote").textContent = [
    hot ? hot + " on a streak" : "",
    pend ? pend + " pending" : ""
  ].filter(Boolean).join(" · ");

  const ladder = ladderColors(rows.map(r => r[key]));

  if (key === "all") { renderAll(rows, ladder); renderHistory("all", "Overall"); return; }

  $("rows").innerHTML = rows.map((r, i) => {
    const rc = r[key];
    const p = key === "cfb" ? r.cfbPct : r.nflPct;
    const played = rc.w + rc.l;
    const st = r.streak[key];
    const lead = isLeader(key, r.name, played);
    const sub = played
      ? streakBadge(st)
      : '<span class="nodata">No results yet</span>';
    return `<div class="prow${lead ? " lead" : ""}">
      <div class="pnum">${i + 1}</div>
      <div class="pmain">
        <div class="pnm">${esc(r.name)}</div>
        ${sub ? `<div class="psub">${sub}</div>` : ""}
      </div>
      <div class="pright">
        <div class="${rungClass(ladder[i])}"${rungStyle(ladder[i])}>${fmtRec(rc)}</div>
        <div class="ppct">${fmtPct(p, rc)}</div>
      </div>
    </div>`;
  }).join("");

  renderHistory(key, key === "cfb" ? "College" : "NFL");
}

/* A row's record wears its rung of the ladder. Nobody who has yet to play gets
   a colour, so their record stays plain. */
function rungClass(c) { return c ? "prec rung" : "prec"; }
function rungStyle(c) {
  return c ? ` style="color:rgb(${c[0]},${c[1]},${c[2]});background:rgba(${c[0]},${c[1]},${c[2]},0.13)"` : "";
}

/* One row per person carrying both records, expandable to their own weeks. */
function renderAll(rows, ladder) {
  $("rows").innerHTML = rows.map((r, i) => {
    const played = r.all.w + r.all.l;
    const lead = isLeader("all", r.name, played);
    const st = r.streak.all;
    const sub = played
      ? streakBadge(st)
      : '<span class="nodata">No results yet</span>';

    const half = (lab, rc, p) => `<div class="sp">
        <span class="spl">${lab}</span>
        <span class="spr ${rc.w + rc.l ? pctClass(p, rc) : "none"}">${
          rc.w + rc.l ? fmtRec(rc) : "&mdash;"}</span>
      </div>`;

    return `<div class="prow all${lead ? " lead" : ""}${OPEN === r.name ? " open" : ""}" data-nm="${esc(r.name)}">
      <div class="ptop">
        <div class="pnum">${i + 1}</div>
        <div class="pmain">
          <div class="pnm">${esc(r.name)}</div>
          ${sub ? `<div class="psub">${sub}</div>` : ""}
        </div>
        <div class="pright">
          <div class="${rungClass(ladder[i])}"${rungStyle(ladder[i])}>${fmtRec(r.all)}</div>
          <div class="ppct">${fmtPct(r.allPct, r.all)}</div>
        </div>
        <span class="pchev">&#9654;</span>
      </div>
      <div class="split">
        ${half("College", r.cfb, r.cfbPct)}
        ${half("NFL", r.nfl, r.nflPct)}
      </div>
      <div class="pdet">
        <div class="pstats">
          <div class="pstat"><span class="psl">Best run</span><span class="psv">${
            r.best.all ? r.best.all + (r.best.all === 1 ? " win" : " straight") : "&mdash;"}</span></div>
          <div class="pstat"><span class="psl">Only miss</span><span class="psv${
            r.solo ? " bad" : ""}">${r.solo ? r.solo + (r.solo === 1 ? " slate" : " slates") : "never"}</span></div>
        </div>
        ${personWeeks(r.name)}
      </div>
    </div>`;
  }).join("");

  $("rows").querySelectorAll(".prow.all").forEach(row => {
    row.addEventListener("click", () => {
      const nm = row.dataset.nm;
      OPEN = OPEN === nm ? null : nm;
      $("rows").querySelectorAll(".prow.all").forEach(x =>
        x.classList.toggle("open", x.dataset.nm === OPEN));
    });
  });
}

/* Everything one person has logged, newest first, both leagues. */
function personWeeks(name) {
  const mine = DATA.entries.slice().reverse().filter(e => {
    const v = e.picks[name] || {};
    return v.result || v.pick;
  });
  if (!mine.length) return '<div class="nodata">Nothing logged for them yet.</div>';

  return mine.map(e => {
    const v = e.picks[name] || {};
    const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "P" ? "p" : "none";
    const mark = v.result || "-";
    const when = e.label.replace(/ College| NFL/, "") + (e.league === "cfb" ? " C" : " N");
    return `<div class="drow">
      <span class="dwk">${esc(when)}</span>
      <span class="dot ${cls}">${mark}</span>
      <span class="dpk${v.pick ? "" : " blank"}">${esc(v.pick || "no pick logged")}</span>
    </div>`;
  }).join("");
}

/* Spelled out rather than a row of letters. Nothing shows below two. */
function streakBadge(n) {
  if (n < 2) return "";
  return `<span class="streak">${n} Straight Wins</span>`;
}

/* A slate is done when all five legs are settled: then it either cashed or it
   did not, and the chip says which. */
function settled(s) { return s.counted === DATA.players.length; }

function renderHistory(key, name) {
  const el = $("hist");
  const list = key === "all" ? DATA.entries.slice() : DATA.entries.filter(e => e.league === key);
  $("histTitle").textContent = "History";

  if (!list.length) {
    el.innerHTML = key === "all"
      ? '<div class="empty">Nothing logged yet.<br>Tap Admin to add the first one.</div>'
      : `<div class="empty">No ${name} results logged yet.<br>Tap Admin to add the first one.</div>`;
    $("histNote").textContent = "";
    return;
  }
  $("histNote").textContent = list.length + " logged";

  const sums = {};
  STATS.summaries.forEach(s => sums[s.id] = s);

  /* Every slate ships shut: whatever is still running already has its own card
     at the top of the page, so nothing needs to be pre-opened down here. */
  el.innerHTML = list.slice().reverse().map(e => {
    const s = sums[e.id] || { w: 0, l: 0 };
    const body = DATA.players.map(p => {
      const v = e.picks[p] || {};
      const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "P" ? "p" : "none";
      const mark = v.result === "P" ? "P" : (v.result || "-");
      const pick = v.pick
        ? `<span class="wl-pick">${esc(v.pick)}</span>`
        : `<span class="wl-pick blank">no pick logged</span>`;
      return `<div class="wl-row"><div class="wl-name">${esc(p)}</div>` +
             `<div class="wl-legs"><div class="wl-leg"><span class="dot ${cls}">${mark}</span>${pick}</div></div></div>`;
    }).join("");
    return `<div class="wk">
      <div class="wk-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="wk-t">${esc(e.label)}</span>
        <span class="wk-m">${settled(s) ? (s.perfect
          ? '<span class="sweep">PARLAY WIN' + (e.payout ? ": " + fmtMoney(e.payout) : "") + '</span>'
          : '<span class="sweep miss">PARLAY LOSS: ' + fmtMoney(DATA.stake) + '</span>') : ""}${
          s.pending ? `<span class="pend-chip">${s.pending} PENDING</span>` : ""}${s.w}-${s.l}<span class="chev">&#9654;</span></span>
      </div>
      <div class="wk-body">${body}
        <button class="btn sm wk-share" data-slate="${esc(e.id)}">Share these picks</button>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-slate]").forEach(b =>
    b.addEventListener("click", () => shareSlate(b.dataset.slate)));
}

$("seg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  LG = b.dataset.lg;
  OPEN = null;
  [...$("seg").children].forEach(c => c.classList.toggle("on", c === b));
  if (STATS) render();
});

$("refresh").addEventListener("click", () => boot());
boot();
</script>
</body>
</html>
