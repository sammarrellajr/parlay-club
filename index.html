<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlay Club</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>Parlay Club</h1>
      <span class="season" id="season"></span>
    </div>
    <div class="navlinks">
      <button class="btn ghost small" id="refresh">Refresh</button>
      <a class="btn small" href="admin.html">Admin</a>
    </div>
  </div>

  <div class="msg err" id="err"></div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>Standings</h2>
    <p class="sub">Ranked by overall win percentage across all picks.</p>
    <div style="overflow-x:auto">
      <table id="standings">
        <thead>
          <tr>
            <th></th>
            <th>Player</th>
            <th class="num">College</th>
            <th class="num hide-sm">College %</th>
            <th class="num">NFL</th>
            <th class="num hide-sm">NFL %</th>
            <th class="num">Overall</th>
            <th class="num">Win %</th>
            <th class="hide-sm">Last 5</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Week by week</h2>
    <p class="sub">Click a week to see every pick.</p>
    <div id="weeks"></div>
  </div>

  <p class="footnote" id="foot"></p>
</div>

<script src="app.js"></script>
<script>
let DATA = null;

async function boot() {
  const err = document.getElementById("err");
  err.classList.remove("show");
  try {
    DATA = await loadResults();
  } catch (e) {
    err.textContent = "Could not load results.json. " + e.message;
    err.classList.add("show");
    return;
  }
  render();
}

function render() {
  const stats = computeStats(DATA);
  document.getElementById("season").textContent = DATA.season ? DATA.season + " Season" : "";

  // Tiles
  const g = stats.group, gp = stats.groupPct;
  document.getElementById("tiles").innerHTML = [
    tile("Group record", fmtRec(g.all), fmtPct(gp.all, g.all) + " across " + stats.weeksLogged + " week" + (stats.weeksLogged === 1 ? "" : "s")),
    tile("Group college", fmtRec(g.cfb), fmtPct(gp.cfb, g.cfb)),
    tile("Group NFL", fmtRec(g.nfl), fmtPct(gp.nfl, g.nfl)),
    tile("Leader", stats.rows.length && stats.rows[0].all.w + stats.rows[0].all.l ? stats.rows[0].name : "--",
         stats.rows.length && stats.rows[0].all.w + stats.rows[0].all.l
           ? fmtRec(stats.rows[0].all) + " (" + fmtPct(stats.rows[0].allPct, stats.rows[0].all) + ")" : "No results yet"),
    tile("Clean sweeps", String(stats.perfectWeeks), "Weeks all 10 picks hit")
  ].join("");

  // Standings
  const tb = document.querySelector("#standings tbody");
  tb.innerHTML = stats.rows.map((r, i) => {
    const played = r.all.w + r.all.l;
    const crown = i === 0 && played > 0 ? '<span class="crown">&#9733;</span>' : "";
    return `<tr>
      <td class="rank">${i + 1}</td>
      <td class="pname">${esc(r.name)}${crown}</td>
      <td class="num rec">${fmtRec(r.cfb)}</td>
      <td class="num pct hide-sm ${pctClass(r.cfbPct, r.cfb)}">${fmtPct(r.cfbPct, r.cfb)}</td>
      <td class="num rec">${fmtRec(r.nfl)}</td>
      <td class="num pct hide-sm ${pctClass(r.nflPct, r.nfl)}">${fmtPct(r.nflPct, r.nfl)}</td>
      <td class="num rec">${fmtRec(r.all)}</td>
      <td class="num pct ${pctClass(r.allPct, r.all)}">${fmtPct(r.allPct, r.all)}</td>
      <td class="hide-sm">${formDots(r.history)}</td>
    </tr>`;
  }).join("");

  // Weeks (newest first)
  const weeksEl = document.getElementById("weeks");
  if (!DATA.weeks.length) {
    weeksEl.innerHTML = '<div class="empty">No weeks logged yet. Head to Admin to add the first one.</div>';
  } else {
    const summaries = {};
    stats.weekSummaries.forEach(s => summaries[s.id] = s);
    weeksEl.innerHTML = DATA.weeks.slice().reverse().map((w, idx) => {
      const s = summaries[w.id] || { w: 0, l: 0 };
      const body = DATA.players.map(p => {
        const e = w.entries[p] || {};
        const legs = LEAGUES.map(lg => {
          const leg = e[lg.key] || {};
          const res = leg.result === "W" ? "w" : leg.result === "L" ? "l" : "none";
          const mark = res === "none" ? "-" : leg.result;
          const pick = leg.pick
            ? `<span class="pk" title="${esc(leg.pick)}">${esc(leg.pick)}</span>`
            : `<span class="pk blank">no pick logged</span>`;
          return `<div class="wk-leg"><span class="dot ${res}">${mark}</span><span class="lg">${lg.label}</span>${pick}</div>`;
        }).join("");
        return `<div class="wk-row"><div class="wk-name">${esc(p)}</div><div class="wk-legs">${legs}</div></div>`;
      }).join("");
      return `<div class="week${idx === 0 ? " open" : ""}">
        <div class="week-head" onclick="this.parentNode.classList.toggle('open')">
          <span class="week-title">${esc(w.label)}</span>
          <span class="week-meta">${s.w}-${s.l} group${s.counted && s.perfect ? " &nbsp;&#9733; sweep" : ""}</span>
        </div>
        <div class="week-body">${body}</div>
      </div>`;
    }).join("");
  }

  document.getElementById("foot").textContent = "Updated from results.json";
}

function tile(label, value, foot) {
  return `<div class="tile"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="foot">${foot}</div></div>`;
}

function formDots(history) {
  const marks = [];
  history.forEach(h => h.marks.forEach(m => marks.push(m)));
  const last = marks.slice(-5);
  if (!last.length) return '<span class="pickline">--</span>';
  return '<div class="form-dots">' + last.map(m => {
    const c = m === "W" ? "w" : m === "L" ? "l" : "none";
    return `<span class="dot ${c}">${m || "-"}</span>`;
  }).join("") + "</div>";
}

document.getElementById("refresh").addEventListener("click", boot);
boot();
</script>
</body>
</html>
