<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlay Club">
<meta name="theme-color" content="#0a0d12">
<link rel="apple-touch-icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<link rel="icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<title>Parlay Club</title>
<link rel="stylesheet" href="styles.css">
<style>
/* One hue for every trend bar, checked against this panel colour for
   contrast and kept clear of the win green and loss red. */
:root { --viz: #3a8ae0; }

/* The All tab: both records on one row, tap a row for that person's weeks. */
.seg { grid-template-columns: 1fr 1fr 1fr; }

.prow.all { display: block; cursor: pointer; }
.prow.all .ptop { display: flex; align-items: center; gap: 11px; }

.pchev {
  color: var(--dim); font-size: 11px; flex: none;
  transition: transform 0.18s;
}
.prow.all.open .pchev { transform: rotate(90deg); }

/* One labelled line per league. Bar length is win rate on a fixed 0-100 scale
   with a tick at 50%, so a player's two bars compare to each other and the
   same bar compares straight down the column. The two bordered boxes this
   replaces showed a bare 9-5 with nothing to measure it against.
   Named lg* on purpose: .mrow and .mv already belong to the money rows in
   the Stats section, and reusing them pulled that box styling in here. */
.lgrow { display: grid; grid-template-columns: 50px 1fr 38px; gap: 9px;
  align-items: center; margin-top: 4px; }
.lgl { font-size: 9.5px; font-weight: 780; letter-spacing: 0.7px; line-height: 1.1;
  text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.lgt { position: relative; height: 7px; background: var(--panel-2); border-radius: 4px; }
.lgf { position: absolute; left: 0; top: 0; bottom: 0; background: var(--viz);
  border-radius: 4px; min-width: 3px; }
.lgt::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 0; border-left: 1px dashed var(--panel-hi); }
.lgv { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  line-height: 1.1; text-align: right; color: var(--muted); white-space: nowrap; }
.lgform { display: grid; grid-template-columns: 50px 1fr; gap: 9px;
  align-items: center; margin-top: 7px; }
.lgform .form { margin-top: 0; }

.pdet { display: none; margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px; }

/* Two stats worth arguing about, above the week-by-week. */
.pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 11px; }
.pstat {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; min-width: 0;
}
.psl {
  font-size: 10px; font-weight: 750; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
}
.psv { font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; }
.psv.bad { color: var(--loss-soft); }
.prow.all.open .pdet { display: block; }
.drow { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
.dwk { font-size: 11px; color: var(--dim); width: 50px; flex: none; white-space: nowrap; }
/* A fixed-width league tag, so a long slate name can never push the pick off
   the row the way the full label used to. */
.dlg {
  font-size: 9px; font-weight: 800; letter-spacing: 0.4px; flex: none;
  width: 36px; text-align: center; padding: 2px 0; border-radius: 4px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
}
.dpk {
  font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dpk.blank { color: var(--dim); font-style: italic; }

/* Full-width bars above the tiles: parlay wins, then the money. */
.parlay {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 13px 16px; margin: 14px 0 9px;
}
.tiles { margin-top: 0; }
.parlay .plab {
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim);
}
.parlay .psubl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.parlay .pval {
  font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; flex: none;
}
.parlay.hit {
  border-color: #2f5c42;
  background: linear-gradient(180deg, #16241c 0%, var(--panel) 75%);
}
.parlay.hit .plab, .parlay.hit .pval { color: var(--accent); }

.icon-btn.sym {
  width: 52px; min-width: 52px; padding: 0;
  font-size: 20px; line-height: 1;
}
.icon-btn.sym.busy { color: var(--dim); }
.icon-btn.sym.done { color: var(--accent); border-color: #2f5c42; }

.admin-link {
  display: block; text-align: center; margin-top: 9px;
  font-size: 12px; font-weight: 650; color: var(--dim);
  text-decoration: none; padding: 6px;
}
.admin-link:active { color: var(--muted); }

/* A slate still running leads the page: the tag, the running count, and the
   five legs themselves, so opening the app tells you what is riding. */
.ip {
  border: 1px solid #6b5312;
  background: linear-gradient(180deg, #241d08 0%, var(--panel-2) 70%);
  border-radius: 15px;
  padding: 13px 14px;
  margin-bottom: 12px;
}
.ip-top { display: flex; align-items: center; gap: 9px; }
.ip-tag {
  font-size: 10px; font-weight: 850; letter-spacing: 0.9px;
  color: #241a02; background: var(--gold);
  border-radius: 5px; padding: 3px 7px; flex: none;
}
.ip-lab { font-size: 14px; font-weight: 700; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ip-rec { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
/* The parlay price, when it was logged. No odds, no chip. */
.ip-odds {
  font-size: 11px; font-weight: 800; flex: none;
  color: var(--gold-soft); background: var(--gold-bg);
  border-radius: 5px; padding: 2px 6px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.ip-legs { margin-top: 11px; display: grid; gap: 6px; }
.ip-leg { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ip-nm { width: 56px; flex: none; font-size: 12.5px; font-weight: 650; }
.ip-pk { font-size: 12.5px; color: var(--muted); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ip-pk.blank { color: #414b5c; }
.ip-share { width: 100%; margin-top: 12px; }

.wk-share { width: 100%; margin-top: 11px; }
/* Sends the season table itself, for a midweek "here is where we stand". */
.stand-share { margin: -12px 0 20px; }

.parlay.mini { padding: 9px 14px; margin-bottom: 12px; }
.parlay.mini .plab { font-size: 10px; letter-spacing: 0.8px; }
.parlay.mini .psubl { font-size: 10.5px; margin-top: 2px; }
.parlay.mini .pval { font-size: 23px; letter-spacing: -0.8px; }

.parlay.up { border-color: #2f5c42; }
.parlay.up .pval { color: var(--accent); }
.parlay.down { border-color: #5c3129; }
.parlay.down .pval { color: var(--loss); }

/* ---- The hero: one number leads, three support it. ---- */
.hero { padding: 2px 0 16px; border-bottom: 1px solid var(--line); }
.hero-lbl { font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim); }
.hero-val { font-size: 42px; font-weight: 800; letter-spacing: -1.6px; line-height: 1.05;
  margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--text); }
.hero-val.up { color: var(--gold); }
.hero-val.down { color: var(--loss); }
.hero-sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

.strip { display: flex; padding: 13px 0; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.strip > div { flex: 1; padding-right: 10px; min-width: 0; }
.strip > div + div { border-left: 1px solid var(--line); padding-left: 13px; }
.s-val { font-size: 18px; font-weight: 750; letter-spacing: -0.4px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-val .of { color: var(--dim); font-size: 13px; font-weight: 600; }
.s-lbl { font-size: 10.5px; color: var(--dim); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- Recent form. Filled or hollow carries it, so the strip still reads
       in grayscale and to a colourblind eye. ---- */
.form { display: flex; gap: 3px; margin-top: 6px; align-items: center; }
.form i { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--panel-hi); }
.form i.w { background: var(--accent); }

/* ---- Two foldaway sections at the foot of the page. Both start shut, so
       opening the app answers "who is winning" in one screen instead of
       scrolling past twenty-six slates to get there. ---- */
.sect { border-bottom: 1px solid var(--line); }
.sect > summary {
  list-style: none; cursor: pointer; display: flex; align-items: baseline;
  justify-content: space-between; gap: 10px; padding: 15px 0;
  -webkit-tap-highlight-color: transparent;
}
.sect > summary::-webkit-details-marker { display: none; }
.sect > summary h2 {
  font-size: 12px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.sect > summary h2::after { content: " \25B8"; color: var(--dim); font-size: 10px; }
.sect[open] > summary h2::after { content: " \25BE"; }
.sect > summary .note { font-size: 11px; color: var(--dim); }
.sect > div { padding-bottom: 18px; }

/* ---- Trend bars. One hue; length is the measure; a dashed line at the
       50% break-even does the interpreting. ---- */
.tgrp { margin-bottom: 20px; }
.tgrp h3 { font-size: 11px; font-weight: 800; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--dim); margin: 0 0 7px; }
.tchart { position: relative; }
.tref { position: absolute; left: calc(78px + 9px + (100% - 154px) / 2); top: 2px; bottom: 2px;
  width: 0; border-left: 1px dashed var(--panel-hi); pointer-events: none; }
.tbar { display: grid; grid-template-columns: 78px 1fr 58px; gap: 9px;
  align-items: center; padding: 5px 0; }
.tbl { font-size: 12.5px; color: var(--muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.ttrack { position: relative; height: 9px; background: var(--panel-2); border-radius: 4px; }
.tfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--viz);
  border-radius: 4px; min-width: 3px; }
.tval { text-align: right; }
.tv { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tn { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tnote { font-size: 10.5px; color: var(--dim); margin-top: 6px; line-height: 1.45; }

/* ---- The league split in dollars. "Sixty-five in, nothing back" lands in a
       way that "44.6%" does not. ---- */
.msplit { display: grid; gap: 7px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.mrow .ml { font-size: 13px; font-weight: 650; }
.mrow .mm { font-size: 11px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mrow .mv { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow .mv.up { color: var(--accent); }
.mrow .mv.down { color: var(--loss); }

.ins { display: flex; flex-direction: column; margin-bottom: 18px; }
.ins div { font-size: 13px; color: var(--muted); line-height: 1.5;
  padding: 7px 0 7px 11px; border-left: 2px solid var(--panel-hi); }
.ins div.good { border-left-color: var(--accent); }
.ins div.bad { border-left-color: var(--loss); }
.ins b { color: var(--text); font-weight: 650; }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="bar">
      <div>
        <h1 class="title">Parlay Club</h1>
        <div class="sub-season" id="season"></div>
      </div>
      <div class="bar-actions">
        <button class="icon-btn sym" id="refresh" aria-label="Refresh" title="Refresh">&#8635;</button>
      </div>
    </div>
    <div class="seg" id="seg">
      <button data-lg="all" class="on">All</button>
      <button data-lg="cfb">College</button>
      <button data-lg="nfl">NFL</button>
    </div>
  </div>

  <div class="msg err" id="err"></div>
  <div class="msg info" id="info"></div>

  <div id="inplay"></div>

  <div class="hero" id="hero"></div>

  <div class="strip" id="strip"></div>

  <div class="rule"></div>

  <div class="sec-head">
    <h2 id="secTitle">Individual records</h2>
    <span class="note" id="secNote"></span>
  </div>
  <div class="rows" id="rows"></div>
  <button class="btn wide stand-share" id="shareStandings">Share Standings Update</button>

  <div class="rule"></div>

  <details class="sect" id="statsSect">
    <summary>
      <h2 id="statsTitle">Stats</h2>
      <span class="note">trends and splits</span>
    </summary>
    <div id="statsPane"></div>
  </details>

  <details class="sect" id="histSect">
    <summary>
      <h2 id="histTitle">History</h2>
      <span class="note" id="histNote"></span>
    </summary>
    <div id="hist"></div>
  </details>

  <p class="foot-note" id="foot"></p>
  <a class="admin-link" href="admin.html">Admin</a>
  <a class="admin-link" href="history.html" style="margin-top:0">History</a>
</div>

<script src="app.js"></script>
<script>
let DATA = null;
let STATS = null;
let LG = "all";
let OPEN = null;        // name of the expanded row in the All view

const $ = id => document.getElementById(id);

let LAST_SIG = "";

function stamp() {
  return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

/* quiet = no button state change, for the automatic refresh on reopen. */
async function boot(quiet) {
  const btn = $("refresh");
  if (!quiet) { btn.disabled = true; btn.classList.add("busy"); }
  $("err").classList.remove("show");
  try {
    DATA = await loadResults();
  } catch (e) {
    $("err").textContent = "Could not load results.json. " + e.message;
    $("err").classList.add("show");
    return;
  } finally {
    btn.disabled = false;
    btn.classList.remove("busy");
  }

  // Two refreshes in the same minute leave the timestamp identical, so the
  // button itself confirms the tap landed.
  if (!quiet) {
    btn.textContent = "\u2713";
    btn.classList.add("done");
    clearTimeout(boot.reset);
    boot.reset = setTimeout(() => {
      btn.textContent = "\u21BB";
      btn.classList.remove("done");
    }, 1400);
  }

  // Nothing on screen moves when the results are unchanged, so say so.
  const sig = JSON.stringify(DATA.entries);
  const changed = LAST_SIG && sig !== LAST_SIG;
  LAST_SIG = sig;

  STATS = computeStats(DATA);
  $("season").textContent = DATA.season ? DATA.season + " Season" : "";
  render();
  if ($("statsSect").open) renderStats();
  $("foot").textContent = "Updated " + stamp() + (changed ? " · new results" : "");
}

// Coming back to the app from the Home Screen should show current numbers.
document.addEventListener("visibilitychange", () => { if (!document.hidden) boot(true); });

/* Everyone tied at the top gets the star, so the rows agree with the Leader
   tile instead of crowning whoever happens to sort first. */
function isLeader(key, name, played) {
  const ld = STATS.leaders[key];
  return played > 0 && !!ld && ld.names.indexOf(name) !== -1;
}

const LG_NAME = { all: "Overall", cfb: "College Football", nfl: "NFL" };
const MONEY_LAB = { all: "Season profit", cfb: "College profit", nfl: "NFL profit" };

/* The longest run anyone has going, for the third slot in the strip.
   Not bestRun: app.js already owns that name and computeStats calls it. */
function topRun(rows, key) {
  let n = 0, who = "";
  rows.forEach(r => { const b = r.best[key] || 0; if (b > n) { n = b; who = r.name; } });
  return { n, who };
}

/* Anything still running goes at the very top, legs and all. */
function renderInPlay() {
  const live = inPlayEntries(DATA);
  const el = $("inplay");
  if (!live.length) { el.innerHTML = ""; return; }

  el.innerHTML = live.map(e => {
    const t = tally(DATA, e);
    const legs = DATA.players.map(p => {
      const v = e.picks[p] || {};
      const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "T" ? "t" : v.result === "P" ? "p" : "none";
      const mark = v.result === "P" ? "P" : (v.result || "-");
      return `<div class="ip-leg"><span class="dot ${cls}">${mark}</span>` +
             `<span class="ip-nm">${esc(p)}</span>` +
             `<span class="ip-pk${v.pick ? "" : " blank"}">${esc(v.pick || "no pick logged")}</span></div>`;
    }).join("");
    const odds = fmtOdds(e.odds);
    return `<div class="ip">
      <div class="ip-top">
        <span class="ip-tag">IN PLAY</span>
        <span class="ip-lab">${esc(e.label)}</span>
        ${odds ? `<span class="ip-odds">${esc(odds)}</span>` : ""}
        <span class="ip-rec">${t.w}-${t.l}</span>
      </div>
      <div class="ip-legs">${legs}</div>
      <button class="btn sm ip-share" data-slate="${esc(e.id)}">Share these picks</button>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-slate]").forEach(b =>
    b.addEventListener("click", () => shareSlate(b.dataset.slate)));
}

/* The season table on its own, for a midweek update with no slate to report. */
async function shareStandings() {
  const url = location.href.replace(/[^/]*$/, "").replace(/\/$/, "") + "/";
  const cv = buildStandingsCard(DATA, url);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  const file = new File([blob], "parlay-club-standings.png", { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: url });
    } else if (navigator.share) {
      await navigator.share({ text: url, url });
      say("info", "Shared the link. This browser will not attach images.");
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      say("info", "Saved the image. This browser has no share sheet.");
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
    say("err", "Share failed: " + err.message);
  }
}

$("shareStandings").addEventListener("click", shareStandings);

/* One image of a slate's five legs, for sending round. */
async function shareSlate(id) {
  const e = DATA.entries.find(x => x.id === id);
  if (!e) return;
  const url = location.href.replace(/[^/]*$/, "").replace(/\/$/, "") + "/";
  const cv = buildSlateCard(DATA, e, url);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  const file = new File([blob], "parlay-club-slate-" + e.id + ".png", { type: "image/png" });
  const text = url;                        // the image says the rest
  const note = t => { $("info").textContent = t; $("info").classList.add("show"); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
    } else if (navigator.share) {
      await navigator.share({ text, url });
      note("Shared the link. This browser will not attach images.");
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      note("Saved the image. This browser has no share sheet.");
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
    note("Share failed: " + err.message);
  }
}

function render() {
  renderInPlay();
  const key = LG;
  const rec = STATS.group[key];
  const gp = STATS.groupPct[key];
  const ld = STATS.leaders[key];
  const rows = STATS.byLeague[key];
  const n = STATS.counts[key];

  const won = STATS.parlays[key];
  const done = STATS.settled[key];
  const m = STATS.money[key];

  /* The money leads. It is the one number that says whether any of this is
     working, and the old page buried it under two other bars. */
  $("hero").innerHTML =
    `<div class="hero-lbl">${MONEY_LAB[key]}</div>
     <div class="hero-val ${m.net > 0 ? "up" : m.net < 0 ? "down" : ""}">${fmtMoney(m.net)}</div>
     <div class="hero-sub">${fmtMoney(m.wagered)} wagered &middot; ${fmtMoney(m.won)} back &middot; ${
       n} ${key === "all" ? (n === 1 ? "slate" : "slates") : (n === 1 ? "week" : "weeks")}${
       m.unpriced ? " &middot; " + m.unpriced + " payout" +
       (m.unpriced === 1 ? "" : "s") + " not entered" : ""}</div>`;

  /* Three supporting numbers on one line, no boxes. */
  const run = topRun(rows, key);
  $("strip").innerHTML =
    `<div>
       <div class="s-val">${won}<span class="of">/${done}</span></div>
       <div class="s-lbl">Parlays hit</div>
     </div>
     <div>
       <div class="s-val">${fmtPct(gp, rec)}</div>
       <div class="s-lbl">Legs won</div>
     </div>
     <div>
       <div class="s-val">${run.n ? "W" + run.n : "&mdash;"}</div>
       <div class="s-lbl">${run.n ? "Best run &middot; " + esc(run.who) : "Best run"}</div>
     </div>`;
  const hot = rows.filter(r => r.streak[key] >= 2).length;
  const cold = rows.filter(r => r.streak[key] <= -2).length;
  const pend = STATS.pending[key];
  $("secNote").textContent = [
    hot ? hot + " hot" : "",
    cold ? cold + " cold" : "",
    pend ? pend + " pending" : ""
  ].filter(Boolean).join(" · ");

  const ladder = ladderColors(rows.map(r => r[key]));

  if (key === "all") { renderAll(rows, ladder); renderHistory("all", "Overall"); return; }

  /* The league tabs open the same way the All tab does, showing only that
     league's picks, because "how has Tim done in NFL" is the question the tab
     was picked for in the first place. */
  $("rows").innerHTML = rows.map((r, i) => {
    const rc = r[key];
    const p = key === "cfb" ? r.cfbPct : r.nflPct;
    const played = rc.w + rc.l;
    const lead = isLeader(key, r.name, played);
    const sub = played
      ? streakBadge(r.streak[key])
      : '<span class="nodata">No results yet</span>';
    return `<div class="prow all${lead ? " lead" : ""}${OPEN === r.name ? " open" : ""}" data-nm="${esc(r.name)}">
      <div class="ptop">
        <div class="pnum">${i + 1}</div>
        <div class="pmain">
          <div class="pnm">${esc(r.name)}</div>
          ${sub ? `<div class="psub">${sub}</div>` : ""}
          <div class="form" title="Last 10 legs, oldest first">${formStrip(r.name, key)}</div>
        </div>
        <div class="pright">
          <div class="${rungClass(ladder[i])}"${rungStyle(ladder[i])}>${fmtRec(rc)}</div>
          <div class="ppct">${fmtPct(p, rc)}</div>
        </div>
        <span class="pchev">&#9654;</span>
      </div>
      <div class="pdet">${personDetail(r, key)}</div>
    </div>`;
  }).join("");

  wireDrilldown();
  renderHistory(key, key === "cfb" ? "College" : "NFL");
}

/* The two stats and the week-by-week, scoped to whichever tab is showing. */
function personDetail(r, key) {
  const best = r.best[key];
  const solo = r.solo[key];
  return `<div class="pstats">
      <div class="pstat"><span class="psl">Best run</span><span class="psv">${
        best ? best + (best === 1 ? " win" : " straight") : "&mdash;"}</span></div>
      <div class="pstat"><span class="psl">Only miss</span><span class="psv${
        solo ? " bad" : ""}">${solo ? solo + (solo === 1 ? " slate" : " slates") : "never"}</span></div>
    </div>
    ${personWeeks(r.name, key === "all" ? null : key)}`;
}

/* One row open at a time, and it survives a re-render because OPEN is held
   outside the markup. */
function wireDrilldown() {
  $("rows").querySelectorAll(".prow.all").forEach(row => {
    row.addEventListener("click", () => {
      const nm = row.dataset.nm;
      OPEN = OPEN === nm ? null : nm;
      $("rows").querySelectorAll(".prow.all").forEach(x =>
        x.classList.toggle("open", x.dataset.nm === OPEN));
    });
  });
}

/* A row's record wears its rung of the ladder. Nobody who has yet to play gets
   a colour, so their record stays plain. */
function rungClass(c) { return c ? "prec rung" : "prec"; }
function rungStyle(c) {
  return c ? ` style="color:rgb(${c[0]},${c[1]},${c[2]});background:rgba(${c[0]},${c[1]},${c[2]},0.13)"` : "";
}

/* One row per person carrying both records, expandable to their own weeks. */
function renderAll(rows, ladder) {
  $("rows").innerHTML = rows.map((r, i) => {
    const played = r.all.w + r.all.l;
    const lead = isLeader("all", r.name, played);
    const st = r.streak.all;
    const sub = played
      ? streakBadge(st)
      : '<span class="nodata">No results yet</span>';

    const bar = (lab, rc) => {
      const n = rc.w + rc.l;
      return `<div class="lgrow">
        <div class="lgl">${lab}</div>
        <div class="lgt"><div class="lgf" style="width:${n ? (rc.w / n * 100).toFixed(1) : 0}%"></div></div>
        <div class="lgv">${n ? fmtRec(rc) : "&mdash;"}</div>
      </div>`;
    };

    return `<div class="prow all${lead ? " lead" : ""}${OPEN === r.name ? " open" : ""}" data-nm="${esc(r.name)}">
      <div class="ptop">
        <div class="pnum">${i + 1}</div>
        <div class="pmain">
          <div class="pnm">${esc(r.name)}</div>
          ${sub ? `<div class="psub">${sub}</div>` : ""}
        </div>
        <div class="pright">
          <div class="${rungClass(ladder[i])}"${rungStyle(ladder[i])}>${fmtRec(r.all)}</div>
          <div class="ppct">${fmtPct(r.allPct, r.all)}</div>
        </div>
        <span class="pchev">&#9654;</span>
      </div>
      ${bar("College", r.cfb)}
      ${bar("NFL", r.nfl)}
      <div class="lgform">
        <div class="lgl">Last 10</div>
        <div class="form" title="Last 10 legs, oldest first">${formStrip(r.name, null)}</div>
      </div>
      <div class="pdet">${personDetail(r, "all")}</div>
    </div>`;
  }).join("");

  wireDrilldown();
}

/* Just the day, no league and no slate name: the row has its own league tag
   and the pick needs the rest of the width. */
function shortDate(iso) {
  const [y, m, d] = String(iso || "").split("-").map(Number);
  if (!y || !m || !d) return "";
  return DOW[new Date(y, m - 1, d).getDay()] + " " + m + "/" + d;
}

/* Everything one person has logged, newest first, both leagues. */
function personWeeks(name, league) {
  const mine = DATA.entries.slice().reverse().filter(e => {
    if (league && e.league !== league) return false;
    const v = e.picks[name] || {};
    return v.result || v.pick;
  });
  if (!mine.length) return '<div class="nodata">Nothing logged for them yet.</div>';

  return mine.map(e => {
    const v = e.picks[name] || {};
    const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "T" ? "t" : v.result === "P" ? "p" : "none";
    const mark = v.result || "-";
    return `<div class="drow">
      <span class="dwk">${esc(shortDate(e.date) || e.label)}</span>
      <span class="dlg">${e.league === "nfl" ? "NFL" : "NCAA"}</span>
      <span class="dot ${cls}">${mark}</span>
      <span class="dpk${v.pick ? "" : " blank"}">${esc(v.pick || "no pick logged")}</span>
    </div>`;
  }).join("");
}

/* Spelled out rather than a row of letters, and it cuts both ways: green for
   a run of wins, red for a run of losses. Nothing shows below two. */
function streakBadge(n) {
  if (n >= 2) return `<span class="streak">${n} Straight Wins</span>`;
  if (n <= -2) return `<span class="streak cold">${-n} Straight Losses</span>`;
  return "";
}

/* A slate is done when all five legs are settled: then it either cashed or it
   did not, and the chip says which. */
function settled(s) { return s.counted === DATA.players.length; }

function renderHistory(key, name) {
  const el = $("hist");
  const list = key === "all" ? DATA.entries.slice() : DATA.entries.filter(e => e.league === key);
  $("histTitle").textContent = "History";

  if (!list.length) {
    el.innerHTML = key === "all"
      ? '<div class="empty">Nothing logged yet.<br>Tap Admin to add the first one.</div>'
      : `<div class="empty">No ${name} results logged yet.<br>Tap Admin to add the first one.</div>`;
    $("histNote").textContent = "";
    return;
  }
  $("histNote").textContent = list.length + " logged";

  const sums = {};
  STATS.summaries.forEach(s => sums[s.id] = s);

  /* Every slate ships shut: whatever is still running already has its own card
     at the top of the page, so nothing needs to be pre-opened down here. */
  el.innerHTML = list.slice().reverse().map(e => {
    const s = sums[e.id] || { w: 0, l: 0 };
    const body = DATA.players.map(p => {
      const v = e.picks[p] || {};
      const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "T" ? "t" : v.result === "P" ? "p" : "none";
      const mark = v.result === "P" ? "P" : (v.result || "-");
      const pick = v.pick
        ? `<span class="wl-pick">${esc(v.pick)}</span>`
        : `<span class="wl-pick blank">no pick logged</span>`;
      return `<div class="wl-row"><div class="wl-name">${esc(p)}</div>` +
             `<div class="wl-legs"><div class="wl-leg"><span class="dot ${cls}">${mark}</span>${pick}</div></div></div>`;
    }).join("");
    return `<div class="wk">
      <div class="wk-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="wk-t">${esc(e.label)}</span>
        <span class="wk-m">${settled(s) ? (s.perfect
          ? '<span class="sweep">PARLAY WIN' + (e.payout ? ": " + fmtMoney(e.payout) : "") + '</span>'
          : '<span class="sweep miss">PARLAY LOSS: ' + fmtMoney(DATA.stake) + '</span>') : ""}${
          s.pending ? `<span class="pend-chip">${s.pending} PENDING</span>` : ""}${s.w}-${s.l}<span class="chev">&#9654;</span></span>
      </div>
      <div class="wk-body">${body}
        <button class="btn sm wk-share" data-slate="${esc(e.id)}">Share these picks</button>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-slate]").forEach(b =>
    b.addEventListener("click", () => shareSlate(b.dataset.slate)));
}

/* ---------- recent form ---------- */

/* The last ten settled legs, oldest to newest. Filled or hollow rather than
   two colours, so it still reads in grayscale and to a colourblind eye. */
function formStrip(name, league) {
  const seq = [];
  DATA.entries.forEach(e => {
    if (league && e.league !== league) return;
    const v = e.picks[name] || {};
    if (v.result === "W" || v.result === "L") seq.push(v.result);
  });
  if (!seq.length) return "";
  return seq.slice(-10).map(r => `<i class="${r === "W" ? "w" : ""}"></i>`).join("");
}

/* ---------- stats and trends ---------- */

/* What kind of bet a pick is, read off the text people actually type into
   admin. Deliberately loose: it has to cope with "J. Chase Anytime TD" and
   "WVU/Cincinnati Over 64.5" from the same box. */
function marketOf(pick) {
  const t = String(pick || "").toLowerCase();
  if (/anytime|touchdown|scorer|\btd\b/.test(t)) return "TD scorer";
  if (/\bover\b|\bunder\b|\bo\/u\b/.test(t)) {
    return (/\//.test(t) || /team (points|under|over)/.test(t)) ? "Game total" : "Player prop";
  }
  if (/[+-]\s?\d/.test(t)) return "Spread";
  return "Moneyline";
}

const MON_LAB = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                 "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function buildTrends(key) {
  const list = key === "all" ? DATA.entries : DATA.entries.filter(e => e.league === key);
  const mkt = {}, mon = {};
  list.forEach(e => {
    const ym = String(e.date || "").slice(0, 7);
    DATA.players.forEach(p => {
      const v = e.picks[p] || {};
      if (v.result !== "W" && v.result !== "L") return;
      const fld = v.result === "W" ? "w" : "l";
      const k = marketOf(v.pick);
      (mkt[k] = mkt[k] || { w: 0, l: 0 })[fld]++;
      if (ym) (mon[ym] = mon[ym] || { w: 0, l: 0 })[fld]++;
    });
  });
  return { mkt, mon };
}

/* One bar. Length is the whole measure, so it starts at zero and runs to
   100%; the dashed line at 50% does the interpreting. */
function tbar(label, rec, showN) {
  const n = rec.w + rec.l;
  if (!n) return "";
  const pct = n ? rec.w / n * 100 : 0;
  return `<div class="tbar" title="${esc(label)}: ${rec.w}-${rec.l}">
      <div class="tbl">${esc(label)}</div>
      <div class="ttrack"><div class="tfill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="tval"><div class="tv">${pct.toFixed(1)}%</div>
        <div class="tn">${showN ? "n=" + n : rec.w + "-" + rec.l}</div></div>
    </div>`;
}

function chart(title, bars, note) {
  if (!bars) return "";
  return `<div class="tgrp"><h3>${esc(title)}</h3>
      <div class="tchart"><div class="tref"></div>${bars}</div>
      ${note ? `<div class="tnote">${note}</div>` : ""}
    </div>`;
}

function renderStats() {
  if (!DATA || !STATS) return;
  const key = LG;
  const t = buildTrends(key);
  const rows = STATS.byLeague[key];
  const out = [];

  /* Dollars before percentages. The league split is the finding of the
     season and "$65 in, nothing back" says it better than a win rate. */
  if (key === "all") {
    const money = [["cfb", "College"], ["nfl", "NFL"]].map(([k, lab]) => {
      const m = STATS.money[k];
      if (!m || !m.wagered) return "";
      const cls = m.net > 0 ? "up" : m.net < 0 ? "down" : "";
      return `<div class="mrow">
          <div><div class="ml">${lab}</div>
            <div class="mm">${fmtMoney(m.wagered)} in &middot; ${fmtMoney(m.won)} back &middot; ${
              STATS.parlays[k]} of ${STATS.settled[k]} hit</div></div>
          <div class="mv ${cls}">${fmtMoney(m.net)}</div>
        </div>`;
    }).join("");
    if (money) out.push(`<div class="tgrp"><h3>Where the money went</h3>
        <div class="msplit">${money}</div></div>`);
  }

  /* Findings in plain language, worked out from the data rather than
     written down, so they stay true as the season goes on. */
  const ins = [];
  if (key === "all") {
    const ch = STATS.parlays.cfb, nh = STATS.parlays.nfl;
    const cs = STATS.settled.cfb, ns = STATS.settled.nfl;
    if (cs && ns) {
      if (ch && !nh) ins.push(["good",
        `Every parlay that cashed was <b>college</b>. The NFL slate is <b>0 for ${ns}</b>.`]);
      else if (nh && !ch) ins.push(["good",
        `Every parlay that cashed was <b>NFL</b>. The college slate is <b>0 for ${cs}</b>.`]);
    }
  }
  const mk = Object.keys(t.mkt).map(k => {
    const v = t.mkt[k], n = v.w + v.l;
    return { k: k, w: v.w, l: v.l, n: n, p: n ? v.w / n : 0 };
  }).filter(x => x.n >= 15).sort((a, b) => a.p - b.p);
  if (mk.length && mk[0].p < 0.5) {
    ins.push(["bad", `<b>${esc(mk[0].k)}s</b> are the leak: <b>${
      Math.round(mk[0].p * 100)}%</b> across ${mk[0].n} legs, the only type under 50%.`]);
  }
  if (mk.length > 1) {
    const b = mk[mk.length - 1];
    ins.push(["", `Best type is the <b>${esc(b.k.toLowerCase())}</b> at <b>${
      Math.round(b.p * 100)}%</b> on ${b.n} legs.`]);
  }
  if (ins.length) {
    out.push(`<div class="ins">${ins.map(x =>
      `<div class="${x[0]}">${x[1]}</div>`).join("")}</div>`);
  }

  /* League split, when both are in view. */
  if (key === "all") {
    const lg = { cfb: { w: 0, l: 0 }, nfl: { w: 0, l: 0 } };
    rows.forEach(r => {
      lg.cfb.w += r.cfb.w; lg.cfb.l += r.cfb.l;
      lg.nfl.w += r.nfl.w; lg.nfl.l += r.nfl.l;
    });
    out.push(chart("College vs NFL",
      tbar("College", lg.cfb) + tbar("NFL", lg.nfl),
      "Dashed line is 50%."));
  }

  /* Bet type. Anything under fifteen legs is noise, so it is named below
     the chart rather than drawn as a bar you would read too much into. */
  const all = Object.keys(t.mkt).map(k => {
    const v = t.mkt[k], n = v.w + v.l;
    return { k: k, rec: v, n: n, p: n ? v.w / n : 0 };
  }).sort((a, b) => b.p - a.p);
  const big = all.filter(x => x.n >= 15);
  const small = all.filter(x => x.n < 15);
  if (big.length) {
    out.push(chart("By bet type",
      big.map(x => tbar(x.k, x.rec, true)).join(""),
      small.length ? "Left out: " + small.map(x =>
        esc(x.k.toLowerCase()) + " (" + x.n + " leg" + (x.n === 1 ? "" : "s") + ")").join(", ") +
        ". Too few to read." : ""));
  }

  /* By month, oldest first. A month under fifteen legs folds into the one
     before it rather than showing up as a spike that is really one slate. */
  const keys = Object.keys(t.mon).sort();
  const buckets = [];
  keys.forEach(ym => {
    const v = t.mon[ym];
    const lab = MON_LAB[Number(ym.slice(5, 7)) - 1] || ym;
    const prev = buckets[buckets.length - 1];
    if (prev && prev.rec.w + prev.rec.l < 15) {
      prev.lab = prev.lab.split("\u2013")[0] + "\u2013" + lab;
      prev.rec.w += v.w; prev.rec.l += v.l;
    } else {
      buckets.push({ lab: lab, rec: { w: v.w, l: v.l } });
    }
  });
  if (buckets.length > 1) {
    out.push(chart("By month", buckets.map(b => tbar(b.lab, b.rec, true)).join("")));
  }

  $("statsPane").innerHTML = out.join("") ||
    '<div class="empty">Not enough logged yet to show a trend.</div>';
}

/* ---------- the two foldaway sections ---------- */

/* Nothing is computed until the section is actually opened. */
$("statsSect").addEventListener("toggle", () => { if ($("statsSect").open) renderStats(); });

$("seg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  LG = b.dataset.lg;
  OPEN = null;
  [...$("seg").children].forEach(c => c.classList.toggle("on", c === b));
  if (STATS) render();
  if ($("statsSect").open) renderStats();
});

$("refresh").addEventListener("click", () => boot());
boot();
</script>
</body>
</html>
