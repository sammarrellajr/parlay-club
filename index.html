<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlay Club">
<meta name="theme-color" content="#0a0d12">
<link rel="apple-touch-icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<link rel="icon" href="1A11D967-A164-4882-93CB-DDBCDE1E5593.png">
<title>Parlay Club</title>
<link rel="stylesheet" href="styles.css">
<style>
/* The All tab: both records on one row, tap a row for that person's weeks. */
.seg { grid-template-columns: 1fr 1fr 1fr; }

.prow.all { display: block; cursor: pointer; }
.prow.all .ptop { display: flex; align-items: center; gap: 11px; }

.pchev {
  color: var(--dim); font-size: 11px; flex: none;
  transition: transform 0.18s;
}
.prow.all.open .pchev { transform: rotate(90deg); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.sp {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; min-width: 0;
}
.spl {
  font-size: 10px; font-weight: 750; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
}
.spr { font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spr.good { color: var(--accent); }
.spr.bad { color: var(--loss); }
.spr.even { color: var(--text); }
.spr.none { color: var(--dim); }

.pdet { display: none; margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px; }
.prow.all.open .pdet { display: block; }
.drow { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
.dwk { font-size: 11px; color: var(--dim); width: 82px; flex: none; white-space: nowrap; }
.dpk {
  font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dpk.blank { color: var(--dim); font-style: italic; }

/* Parlay banner: all five legs cashing is the whole point, so it gets its
   own full-width row above everything else. */
.parlay {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 13px 16px; margin: 14px 0 9px;
}
.tiles { margin-top: 0; }
.parlay .plab {
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim);
}
.parlay .psubl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.parlay .pval {
  font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; flex: none;
}
.parlay.hit {
  border-color: #6b5312;
  background: linear-gradient(180deg, #241d07 0%, var(--panel) 75%);
}
.parlay.hit .plab, .parlay.hit .pval { color: var(--gold); }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="bar">
      <div>
        <h1 class="title">Parlay Club</h1>
        <div class="sub-season" id="season"></div>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="refresh">Refresh</button>
        <a class="icon-btn" href="admin.html">Admin</a>
      </div>
    </div>
    <div class="seg" id="seg">
      <button data-lg="all" class="on">All</button>
      <button data-lg="cfb">College</button>
      <button data-lg="nfl">NFL</button>
    </div>
  </div>

  <div class="msg err" id="err"></div>

  <div class="parlay" id="parlay"></div>

  <div class="tiles" id="tiles"></div>

  <div class="sec-head">
    <h2 id="secTitle">Standings</h2>
    <span class="note" id="secNote"></span>
  </div>
  <div class="rows" id="rows"></div>

  <div class="sec-head">
    <h2 id="histTitle">History</h2>
    <span class="note" id="histNote"></span>
  </div>
  <div id="hist"></div>

  <p class="foot-note" id="foot"></p>
</div>

<script src="app.js"></script>
<script>
let DATA = null;
let STATS = null;
let LG = "all";
let OPEN = null;        // name of the expanded row in the All view

const $ = id => document.getElementById(id);

let LAST_SIG = "";

function stamp() {
  return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

/* quiet = no button state change, for the automatic refresh on reopen. */
async function boot(quiet) {
  const btn = $("refresh");
  if (!quiet) { btn.disabled = true; btn.textContent = "..."; }
  $("err").classList.remove("show");
  try {
    DATA = await loadResults();
  } catch (e) {
    $("err").textContent = "Could not load results.json. " + e.message;
    $("err").classList.add("show");
    return;
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }

  // Two refreshes in the same minute leave the timestamp identical, so the
  // button itself confirms the tap landed.
  if (!quiet) {
    btn.textContent = "Updated";
    clearTimeout(boot.reset);
    boot.reset = setTimeout(() => { btn.textContent = "Refresh"; }, 1400);
  }

  // Nothing on screen moves when the results are unchanged, so say so.
  const sig = JSON.stringify(DATA.entries);
  const changed = LAST_SIG && sig !== LAST_SIG;
  LAST_SIG = sig;

  STATS = computeStats(DATA);
  $("season").textContent = DATA.season ? DATA.season + " Season" : "";
  render();
  $("foot").textContent = "Updated " + stamp() + (changed ? " · new results" : "");
}

// Coming back to the app from the Home Screen should show current numbers.
document.addEventListener("visibilitychange", () => { if (!document.hidden) boot(true); });

/* Everyone tied at the top gets the star, so the rows agree with the Leader
   tile instead of crowning whoever happens to sort first. */
function isLeader(key, name, played) {
  const ld = STATS.leaders[key];
  return played > 0 && !!ld && ld.names.indexOf(name) !== -1;
}

const LG_NAME = { all: "Overall", cfb: "College Football", nfl: "NFL" };
const TILE_LAB = { all: "Group overall", cfb: "Group college", nfl: "Group NFL" };
const PARLAY_LAB = { all: "Parlay wins", cfb: "College parlay wins", nfl: "NFL parlay wins" };

function render() {
  const key = LG;
  const rec = STATS.group[key];
  const gp = STATS.groupPct[key];
  const ld = STATS.leaders[key];
  const rows = STATS.byLeague[key];
  const n = STATS.counts[key];

  const won = STATS.parlays[key];
  const done = STATS.settled[key];
  $("parlay").className = "parlay" + (won ? " hit" : "");
  $("parlay").innerHTML =
    `<div>
       <div class="plab">${PARLAY_LAB[key]}</div>
       <div class="psubl">${done
         ? "out of " + done + " completed slate" + (done === 1 ? "" : "s")
         : "no slate has finished yet"}</div>
     </div>
     <div class="pval">${won}</div>`;

  $("tiles").innerHTML =
    `<div class="tile">
       <div class="lab">${TILE_LAB[key]}</div>
       <div class="val">${fmtRec(rec)}</div>
       <div class="foot">${fmtPct(gp, rec)} &middot; ${n} ${
         key === "all" ? (n === 1 ? "entry" : "entries") : (n === 1 ? "week" : "weeks")}</div>
     </div>
     <div class="tile">
       <div class="lab">Leader</div>
       <div class="val name">${esc(leaderLabel(ld))}</div>
       <div class="foot">${esc(leaderFoot(ld))}</div>
     </div>`;

  $("secTitle").textContent = LG_NAME[key];
  const hot = rows.filter(r => r.streak[key] >= 2).length;
  const pend = STATS.pending[key];
  $("secNote").textContent = [
    hot ? hot + " on a streak" : "",
    pend ? pend + " pending" : ""
  ].filter(Boolean).join(" · ");

  if (key === "all") { renderAll(rows); renderHistory("all", "Overall"); return; }

  $("rows").innerHTML = rows.map((r, i) => {
    const rc = r[key];
    const p = key === "cfb" ? r.cfbPct : r.nflPct;
    const played = rc.w + rc.l;
    const st = r.streak[key];
    const lead = isLeader(key, r.name, played);
    const sub = played
      ? (st >= 2 ? `<span class="streak">${st} straight</span>` : "") + dots(r.seq[key])
      : '<span class="nodata">No results yet</span>';
    return `<div class="prow${lead ? " lead" : ""}">
      <div class="pnum">${i + 1}</div>
      <div class="pmain">
        <div class="pnm">${esc(r.name)}${lead ? '<span class="crown">&#9733;</span>' : ""}</div>
        <div class="psub">${sub}</div>
      </div>
      <div class="pright">
        <div class="prec">${fmtRec(rc)}</div>
        <div class="ppct ${pctClass(p, rc)}">${fmtPct(p, rc)}</div>
      </div>
    </div>`;
  }).join("");

  renderHistory(key, key === "cfb" ? "College" : "NFL");
}

/* One row per person carrying both records, expandable to their own weeks. */
function renderAll(rows) {
  $("rows").innerHTML = rows.map((r, i) => {
    const played = r.all.w + r.all.l;
    const lead = isLeader("all", r.name, played);
    const st = r.streak.all;
    const sub = played
      ? (st >= 2 ? `<span class="streak">${st} straight</span>` : "") + dots(r.seq.all)
      : '<span class="nodata">No results yet</span>';

    const half = (lab, rc, p) => `<div class="sp">
        <span class="spl">${lab}</span>
        <span class="spr ${rc.w + rc.l ? pctClass(p, rc) : "none"}">${
          rc.w + rc.l ? fmtRec(rc) : "&mdash;"}</span>
      </div>`;

    return `<div class="prow all${lead ? " lead" : ""}${OPEN === r.name ? " open" : ""}" data-nm="${esc(r.name)}">
      <div class="ptop">
        <div class="pnum">${i + 1}</div>
        <div class="pmain">
          <div class="pnm">${esc(r.name)}${lead ? '<span class="crown">&#9733;</span>' : ""}</div>
          <div class="psub">${sub}</div>
        </div>
        <div class="pright">
          <div class="prec">${fmtRec(r.all)}</div>
          <div class="ppct ${pctClass(r.allPct, r.all)}">${fmtPct(r.allPct, r.all)}</div>
        </div>
        <span class="pchev">&#9654;</span>
      </div>
      <div class="split">
        ${half("College", r.cfb, r.cfbPct)}
        ${half("NFL", r.nfl, r.nflPct)}
      </div>
      <div class="pdet">${personWeeks(r.name)}</div>
    </div>`;
  }).join("");

  $("rows").querySelectorAll(".prow.all").forEach(row => {
    row.addEventListener("click", () => {
      const nm = row.dataset.nm;
      OPEN = OPEN === nm ? null : nm;
      $("rows").querySelectorAll(".prow.all").forEach(x =>
        x.classList.toggle("open", x.dataset.nm === OPEN));
    });
  });
}

/* Everything one person has logged, newest first, both leagues. */
function personWeeks(name) {
  const mine = DATA.entries.slice().reverse().filter(e => {
    const v = e.picks[name] || {};
    return v.result || v.pick;
  });
  if (!mine.length) return '<div class="nodata">Nothing logged for them yet.</div>';

  return mine.map(e => {
    const v = e.picks[name] || {};
    const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "P" ? "p" : "none";
    const mark = v.result || "-";
    const when = e.label.replace(/ College| NFL/, "") + (e.league === "cfb" ? " C" : " N");
    return `<div class="drow">
      <span class="dwk">${esc(when)}</span>
      <span class="dot ${cls}">${mark}</span>
      <span class="dpk${v.pick ? "" : " blank"}">${esc(v.pick || "no pick logged")}</span>
    </div>`;
  }).join("");
}

function dots(seq) {
  const last = (seq || []).filter(m => m !== null).slice(-5);
  if (!last.length) return "";
  return '<div class="dots">' + last.map(m =>
    `<span class="dot ${m === "W" ? "w" : "l"}">${m}</span>`).join("") + "</div>";
}

function renderHistory(key, name) {
  const el = $("hist");
  const list = key === "all" ? DATA.entries.slice() : DATA.entries.filter(e => e.league === key);
  $("histTitle").textContent = key === "all" ? "Every entry" : name + " history";

  if (!list.length) {
    el.innerHTML = key === "all"
      ? '<div class="empty">Nothing logged yet.<br>Tap Admin to add the first one.</div>'
      : `<div class="empty">No ${name} results logged yet.<br>Tap Admin to add the first one.</div>`;
    $("histNote").textContent = "";
    return;
  }
  $("histNote").textContent = list.length + " logged";

  const sums = {};
  STATS.summaries.forEach(s => sums[s.id] = s);

  el.innerHTML = list.slice().reverse().map((e, idx) => {
    const s = sums[e.id] || { w: 0, l: 0 };
    const body = DATA.players.map(p => {
      const v = e.picks[p] || {};
      const cls = v.result === "W" ? "w" : v.result === "L" ? "l" : v.result === "P" ? "p" : "none";
      const mark = v.result === "P" ? "P" : (v.result || "-");
      const pick = v.pick
        ? `<span class="wl-pick">${esc(v.pick)}</span>`
        : `<span class="wl-pick blank">no pick logged</span>`;
      return `<div class="wl-row"><div class="wl-name">${esc(p)}</div>` +
             `<div class="wl-legs"><div class="wl-leg"><span class="dot ${cls}">${mark}</span>${pick}</div></div></div>`;
    }).join("");
    return `<div class="wk${idx === 0 ? " open" : ""}">
      <div class="wk-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="wk-t">${esc(e.label)}</span>
        <span class="wk-m">${s.counted && s.perfect ? '<span class="sweep">SWEEP</span>' : ""}${s.pending ? `<span class="pend-chip">${s.pending} PENDING</span>` : ""}${s.w}-${s.l}<span class="chev">&#9654;</span></span>
      </div>
      <div class="wk-body">${body}</div>
    </div>`;
  }).join("");
}

$("seg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  LG = b.dataset.lg;
  OPEN = null;
  [...$("seg").children].forEach(c => c.classList.toggle("on", c === b));
  if (STATS) render();
});

$("refresh").addEventListener("click", () => boot());
boot();
</script>
</body>
</html>
